<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ILU Social</title>
  <style>
    :root {
      --brand: #6c5ce7;
      --brand-dark: #4834d4;
      --accent: #00cec9;
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #1c1e21;
      --muted: #65676b;
      --border: #dddfe2;
      --danger: #e74c3c;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    button, input, textarea { font: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.9rem clamp(1rem, 4vw, 3rem);
      background: var(--card);
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-size: 1.65rem;
      font-weight: 900;
      color: var(--brand);
      letter-spacing: -0.05em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      color: white;
      background: linear-gradient(135deg, var(--brand), var(--accent));
      box-shadow: 0 10px 24px rgba(108, 92, 231, 0.35);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--muted);
      font-weight: 700;
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 0.72rem 1rem;
      color: white;
      background: var(--brand);
      cursor: pointer;
      font-weight: 800;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(108, 92, 231, 0.25); }
    .btn.secondary { background: #eef0f5; color: var(--text); }
    .btn.danger { background: var(--danger); }
    .btn.small { padding: 0.52rem 0.8rem; font-size: 0.9rem; }

    .layout {
      display: grid;
      grid-template-columns: minmax(210px, 270px) minmax(0, 680px) minmax(220px, 300px);
      gap: 1.2rem;
      max-width: 1240px;
      margin: 1.2rem auto;
      padding: 0 1rem 2rem;
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      border: 1px solid rgba(221, 223, 226, 0.8);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.05);
    }

    .panel { padding: 1rem; }
    .panel h2, .panel h3 { margin: 0 0 0.8rem; }

    .profile-card {
      overflow: hidden;
      position: sticky;
      top: 86px;
    }

    .cover {
      min-height: 92px;
      background: linear-gradient(135deg, var(--brand), #fd79a8, var(--accent));
    }

    .avatar {
      width: 78px;
      height: 78px;
      border: 4px solid white;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: -39px auto 0;
      background: #ffeaa7;
      font-size: 2rem;
      font-weight: 900;
    }

    .center { text-align: center; }
    .muted { color: var(--muted); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border);
      margin-top: 1rem;
      padding-top: 1rem;
      text-align: center;
    }

    .stats strong { display: block; font-size: 1.25rem; }

    .composer { padding: 1rem; margin-bottom: 1rem; }
    .composer-head { display: flex; gap: 0.8rem; align-items: flex-start; }
    .mini-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      background: #dfe6e9;
      font-weight: 900;
    }

    textarea {
      width: 100%;
      min-height: 86px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0.9rem;
      outline: none;
      background: #f8f9fb;
    }

    textarea:focus, input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.12); }

    .composer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 0.9rem;
    }

    .upload-label {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.62rem 0.85rem;
      border-radius: 999px;
      background: #eef0f5;
      cursor: pointer;
      font-weight: 800;
    }

    .upload-label input { display: none; }
    .preview { max-width: 180px; max-height: 120px; border-radius: 14px; display: none; margin-top: 0.75rem; }

    .post { padding: 1rem; margin-bottom: 1rem; }
    .post-header { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
    .author { display: flex; align-items: center; gap: 0.7rem; }
    .post p { white-space: pre-wrap; line-height: 1.5; }
    .post-image { width: 100%; max-height: 460px; object-fit: cover; border-radius: 16px; border: 1px solid var(--border); }

    .post-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.4rem;
      border-top: 1px solid var(--border);
      margin-top: 0.8rem;
      padding-top: 0.7rem;
    }

    .action-btn {
      border: 0;
      background: transparent;
      border-radius: 10px;
      padding: 0.7rem;
      color: var(--muted);
      cursor: pointer;
      font-weight: 800;
    }

    .action-btn:hover, .action-btn.active { background: #f0f2f5; color: var(--brand); }

    .comments { margin-top: 0.7rem; }
    .comment { background: #f0f2f5; border-radius: 14px; padding: 0.65rem 0.8rem; margin-top: 0.45rem; }
    .comment-form { display: flex; gap: 0.45rem; margin-top: 0.6rem; }
    .comment-form input, .login-box input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.72rem 0.9rem;
      outline: none;
      background: white;
    }

    .login-wrap {
      min-height: calc(100vh - 75px);
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: radial-gradient(circle at top left, rgba(108, 92, 231, 0.18), transparent 32%), var(--bg);
    }

    .login-box {
      width: min(100%, 430px);
      padding: 1.3rem;
    }

    .login-box form { display: grid; gap: 0.8rem; }
    .login-box h1 { margin-bottom: 0.35rem; }

    .feature-list { display: grid; gap: 0.75rem; }
    .feature { display: flex; gap: 0.7rem; align-items: center; padding: 0.8rem; background: #f8f9fb; border-radius: 14px; }
    .hidden { display: none !important; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .profile-card { position: static; }
      .right-rail { order: 3; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">I</span> ILU</div>
    <div class="top-actions logged-in hidden">
      <span id="navName"></span>
      <button class="btn secondary small" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main id="loginView" class="login-wrap">
    <section class="card login-box">
      <h1>Welcome to ILU</h1>
      <p class="muted">A lightweight social media demo with login, statuses, photo uploads, likes, comments, and sharing.</p>
      <form id="loginForm">
        <input id="nameInput" type="text" placeholder="Your name" required />
        <input id="emailInput" type="email" placeholder="Email address" required />
        <button class="btn" type="submit">Login / Create Profile</button>
      </form>
    </section>
  </main>

  <main id="appView" class="layout hidden">
    <aside class="card profile-card">
      <div class="cover"></div>
      <div class="avatar" id="profileAvatar">I</div>
      <div class="panel center">
        <h2 id="profileName">ILU User</h2>
        <p class="muted" id="profileEmail">user@ilu.social</p>
        <div class="stats">
          <span><strong id="postCount">0</strong>Posts</span>
          <span><strong id="likeCount">0</strong>Likes</span>
          <span><strong>1.2K</strong>Friends</span>
        </div>
      </div>
    </aside>

    <section>
      <article class="card composer">
        <div class="composer-head">
          <div class="mini-avatar" id="composerAvatar">I</div>
          <textarea id="statusInput" placeholder="What's on your mind?"></textarea>
        </div>
        <img id="imagePreview" class="preview" alt="Upload preview" />
        <div class="composer-actions">
          <label class="upload-label">📷 Upload photo<input id="photoInput" type="file" accept="image/*" /></label>
          <button class="btn" id="postBtn">Post Status</button>
        </div>
      </article>
      <div id="feed"></div>
    </section>

    <aside class="right-rail">
      <section class="card panel">
        <h3>ILU features</h3>
        <div class="feature-list">
          <div class="feature">🔐 Simple local login</div>
          <div class="feature">📝 Status timeline</div>
          <div class="feature">📸 Photo uploads</div>
          <div class="feature">💜 Likes and comments</div>
          <div class="feature">🔁 Share action</div>
        </div>
      </section>
    </aside>
  </main>

  <script>
    const randomId = () => (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);

    const samplePosts = [
      {
        id: randomId(),
        author: 'ILU Team',
        email: 'hello@ilu.social',
        text: 'Welcome to ILU! Share a status, upload a photo, like posts, and comment with friends.',
        image: '',
        liked: false,
        likes: 12,
        comments: ['This feels friendly already!'],
        createdAt: new Date(Date.now() - 1000 * 60 * 35).toISOString()
      }
    ];

    const state = {
      user: JSON.parse(localStorage.getItem('iluUser') || 'null'),
      posts: JSON.parse(localStorage.getItem('iluPosts') || 'null') || samplePosts,
      imageData: ''
    };

    const $ = (id) => document.getElementById(id);

    function save() {
      localStorage.setItem('iluUser', JSON.stringify(state.user));
      localStorage.setItem('iluPosts', JSON.stringify(state.posts));
    }

    function initials(name) {
      return (name || 'ILU').split(' ').map(part => part[0]).join('').slice(0, 2).toUpperCase();
    }

    function timeAgo(dateString) {
      const seconds = Math.max(1, Math.floor((Date.now() - new Date(dateString)) / 1000));
      if (seconds < 60) return `${seconds}s ago`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      return `${Math.floor(hours / 24)}d ago`;
    }

    function renderShell() {
      const loggedIn = Boolean(state.user);
      $('loginView').classList.toggle('hidden', loggedIn);
      $('appView').classList.toggle('hidden', !loggedIn);
      document.querySelectorAll('.logged-in').forEach(el => el.classList.toggle('hidden', !loggedIn));
      if (!loggedIn) return;
      const avatar = initials(state.user.name);
      $('navName').textContent = state.user.name;
      $('profileName').textContent = state.user.name;
      $('profileEmail').textContent = state.user.email;
      $('profileAvatar').textContent = avatar;
      $('composerAvatar').textContent = avatar;
      renderFeed();
    }

    function renderStats() {
      const ownPosts = state.posts.filter(post => post.email === state.user.email).length;
      const totalLikes = state.posts.reduce((sum, post) => sum + post.likes, 0);
      $('postCount').textContent = ownPosts;
      $('likeCount').textContent = totalLikes;
    }

    function renderFeed() {
      $('feed').innerHTML = state.posts.map(post => `
        <article class="card post" data-id="${post.id}">
          <div class="post-header">
            <div class="author">
              <div class="mini-avatar">${escapeHtml(initials(post.author))}</div>
              <div><strong>${escapeHtml(post.author)}</strong><div class="muted">${timeAgo(post.createdAt)}</div></div>
            </div>
            ${post.email === state.user.email ? '<button class="btn danger small delete-post">Delete</button>' : ''}
          </div>
          <p>${escapeHtml(post.text)}</p>
          ${post.image ? `<img class="post-image" src="${post.image}" alt="Uploaded by ${escapeHtml(post.author)}" />` : ''}
          <div class="muted">${post.likes} ${post.likes === 1 ? 'like' : 'likes'} • ${post.comments.length} comments</div>
          <div class="post-actions">
            <button class="action-btn like-post ${post.liked ? 'active' : ''}">💜 Like</button>
            <button class="action-btn focus-comment">💬 Comment</button>
            <button class="action-btn share-post">🔁 Share</button>
          </div>
          <div class="comments">
            ${post.comments.map(comment => `<div class="comment">${escapeHtml(comment)}</div>`).join('')}
            <form class="comment-form">
              <input type="text" placeholder="Write a comment..." required />
              <button class="btn small" type="submit">Send</button>
            </form>
          </div>
        </article>
      `).join('');
      renderStats();
    }

    function escapeHtml(value) {
      return value.replace(/[&<>'"]/g, char => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[char]));
    }

    $('loginForm').addEventListener('submit', (event) => {
      event.preventDefault();
      state.user = { name: $('nameInput').value.trim(), email: $('emailInput').value.trim() };
      save();
      renderShell();
    });

    $('logoutBtn').addEventListener('click', () => {
      state.user = null;
      localStorage.removeItem('iluUser');
      renderShell();
    });

    $('photoInput').addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        state.imageData = reader.result;
        $('imagePreview').src = state.imageData;
        $('imagePreview').style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    $('postBtn').addEventListener('click', () => {
      const text = $('statusInput').value.trim();
      if (!text && !state.imageData) {
        alert('Write a status or upload a photo first.');
        return;
      }
      state.posts.unshift({
        id: randomId(),
        author: state.user.name,
        email: state.user.email,
        text,
        image: state.imageData,
        liked: false,
        likes: 0,
        comments: [],
        createdAt: new Date().toISOString()
      });
      $('statusInput').value = '';
      $('photoInput').value = '';
      $('imagePreview').style.display = 'none';
      state.imageData = '';
      save();
      renderFeed();
    });

    $('feed').addEventListener('click', (event) => {
      const postEl = event.target.closest('.post');
      if (!postEl) return;
      const post = state.posts.find(item => item.id === postEl.dataset.id);
      if (!post) return;
      if (event.target.classList.contains('like-post')) {
        post.liked = !post.liked;
        post.likes += post.liked ? 1 : -1;
        save();
        renderFeed();
      }
      if (event.target.classList.contains('delete-post')) {
        state.posts = state.posts.filter(item => item.id !== post.id);
        save();
        renderFeed();
      }
      if (event.target.classList.contains('focus-comment')) {
        postEl.querySelector('.comment-form input').focus();
      }
      if (event.target.classList.contains('share-post')) {
        navigator.clipboard?.writeText(`${post.author} on ILU: ${post.text}`).then(() => alert('Post copied for sharing!'));
      }
    });

    $('feed').addEventListener('submit', (event) => {
      if (!event.target.classList.contains('comment-form')) return;
      event.preventDefault();
      const postEl = event.target.closest('.post');
      const post = state.posts.find(item => item.id === postEl.dataset.id);
      const input = event.target.querySelector('input');
      post.comments.push(input.value.trim());
      save();
      renderFeed();
    });

    renderShell();
  </script>
</body>
</html>
