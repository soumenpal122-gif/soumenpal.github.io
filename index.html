<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ILU Social</title>
<style>
:root{--b:#6c5ce7;--a:#00cec9;--bg:#f0f2f5;--card:#fff;--text:#1c1e21;--muted:#65676b;--border:#dddfe2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.top{padding:14px 5%;background:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 12px #0001}.brand{font-size:26px;font-weight:900;color:var(--b)}button{border:0;border-radius:999px;padding:10px 16px;background:var(--b);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#eef0f5;color:#222}.layout{max-width:1100px;margin:20px auto;padding:0 15px;display:grid;grid-template-columns:260px 1fr;gap:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 6px 20px #0000000a}.avatar{width:82px;height:82px;border-radius:50%;margin:0 auto 10px;background:#ffeaa7;display:grid;place-items:center;font-size:28px;font-weight:900;overflow:hidden}.avatar img,.mini img,.post img{width:100%;height:100%;object-fit:cover}.mini{width:45px;height:45px;border-radius:50%;background:#dfe6e9;display:grid;place-items:center;overflow:hidden;font-weight:800;flex:none}.center{text-align:center}.muted{color:var(--muted)}.upload{display:inline-block;background:#eef0f5;color:#222;padding:10px 14px;border-radius:999px;font-weight:700;cursor:pointer;margin:8px 0}.upload input{display:none}.composer{display:flex;gap:10px}.composer textarea{flex:1;min-height:80px;border:1px solid var(--border);border-radius:14px;padding:12px;resize:vertical}.actions{margin-top:10px;display:flex;justify-content:space-between;align-items:center}.preview{display:none;max-width:240px;max-height:180px;border-radius:14px;margin-top:10px}.post{margin-top:15px}.posthead{display:flex;align-items:center;gap:10px}.postimage{width:100%;max-height:500px;border-radius:14px;margin-top:10px}.postbuttons{display:flex;gap:8px;border-top:1px solid var(--border);margin-top:10px;padding-top:8px}.postbuttons button{flex:1;background:transparent;color:var(--muted)}.postbuttons button.active{color:var(--b);background:#f0f2f5}.comment{background:#f0f2f5;border-radius:12px;padding:8px;margin-top:6px}.commentform{display:flex;gap:6px;margin-top:8px}.commentform input{flex:1;border:1px solid var(--border);border-radius:999px;padding:9px}.login{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:20px}.login .card{width:min(430px,100%)}.login input{width:100%;padding:12px;margin:6px 0;border:1px solid var(--border);border-radius:999px}.hidden{display:none!important}@media(max-width:750px){.layout{grid-template-columns:1fr}.composer{flex-direction:column}}
</style></head>
<body>
<header class="top"><div class="brand">💜 ILU</div><div id="nav"></div></header>
<main id="login" class="login"><section class="card"><h1>Welcome to ILU</h1><p class="muted">Login and share photos and statuses.</p><form id="loginForm"><input id="name" placeholder="Your name" required><input id="email" type="email" placeholder="Email address" required><button>Login / Create Profile</button></form></section></main>
<main id="app" class="layout hidden">
<aside class="card center"><div id="profileAvatar" class="avatar"></div><h2 id="profileName"></h2><p id="profileEmail" class="muted"></p><label class="upload">🖼️ Change profile photo<input id="profilePhoto" type="file" accept="image/jpeg,image/png,image/webp"></label><p><b id="postCount">0</b> Posts</p></aside>
<section>
<article class="card"><div class="composer"><div id="composerAvatar" class="mini"></div><textarea id="status" placeholder="What's on your mind?"></textarea></div><img id="preview" class="preview" alt="Photo preview"><div class="actions"><label class="upload">📷 Upload photo<input id="postPhoto" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="postBtn">Post Status</button></div></article><div id="feed"></div>
</section></main>
<script>
const $=id=>document.getElementById(id), key='iluUser',postsKey='iluPosts';let user=JSON.parse(localStorage.getItem(key)||'null'),posts=JSON.parse(localStorage.getItem(postsKey)||'null')||[],selectedImage='';
const initials=n=>(n||'ILU').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(key,JSON.stringify(user));localStorage.setItem(postsKey,JSON.stringify(posts))}
function readImage(file,done){if(!file)return;if(!file.type.startsWith('image/'))return alert('Please select an image file.');if(file.size>5*1024*1024)return alert('Photo must be smaller than 5 MB.');const r=new FileReader();r.onload=e=>done(e.target.result);r.onerror=()=>alert('Could not read the photo.');r.readAsDataURL(file)}
function avatar(el,u){el.innerHTML=u&&u.profileImage?`<img src="${u.profileImage}" alt="Profile">`:esc(initials(u?.name))}
function render(){const logged=!!user;$('login').classList.toggle('hidden',logged);$('app').classList.toggle('hidden',!logged);if(!logged){$('nav').innerHTML='';return}$('nav').innerHTML=`${esc(user.name)} <button class="secondary" id="logout">Logout</button>`;$('logout').onclick=()=>{user=null;localStorage.removeItem(key);render()};$('profileName').textContent=user.name;$('profileEmail').textContent=user.email;avatar($('profileAvatar'),user);avatar($('composerAvatar'),user);$('postCount').textContent=posts.filter(p=>p.email===user.email).length;renderFeed()}
function renderFeed(){$('feed').innerHTML=posts.map(p=>`<article class="card post" data-id="${p.id}"><div class="posthead"><div class="mini">${p.imageAuthor?`<img src="${p.imageAuthor}">`:esc(initials(p.author))}</div><div><b>${esc(p.author)}</b><div class="muted">${new Date(p.date).toLocaleString()}</div></div></div>${p.text?`<p>${esc(p.text)}</p>`:''}${p.image?`<img class="postimage" src="${p.image}" alt="Photo uploaded by ${esc(p.author)}">`:''}<div class="muted">${p.likes} likes · ${p.comments.length} comments</div><div class="postbuttons"><button class="like ${p.liked?'active':''}">💜 Like</button><button class="commentFocus">💬 Comment</button>${p.email===user.email?'<button class="delete">🗑️ Delete</button>':'<button class="share">🔗 Share</button>'}</div><div>${p.comments.map(c=>`<div class="comment">${esc(c)}</div>`).join('')}</div><form class="commentform"><input placeholder="Write a comment..." required><button>Send</button></form></article>`).join('')}
$('loginForm').onsubmit=e=>{e.preventDefault();user={name:$('name').value.trim(),email:$('email').value.trim(),profileImage:''};save();render()};
$('profilePhoto').onchange=e=>readImage(e.target.files[0],img=>{user.profileImage=img;save();render()});
$('postPhoto').onchange=e=>readImage(e.target.files[0],img=>{selectedImage=img;$('preview').src=img;$('preview').style.display='block'});
$('postBtn').onclick=()=>{const text=$('status').value.trim();if(!text&&!selectedImage)return alert('Write a status or select a photo first.');posts.unshift({id:crypto.randomUUID(),author:user.name,email:user.email,imageAuthor:user.profileImage||'',text,image:selectedImage,likes:0,liked:false,comments:[],date:new Date().toISOString()});$('status').value='';$('postPhoto').value='';selectedImage='';$('preview').style.display='none';save();renderFeed();$('postCount').textContent=posts.filter(p=>p.email===user.email).length};
$('feed').onclick=e=>{const el=e.target.closest('.post');if(!el)return;const p=posts.find(x=>x.id===el.dataset.id);if(!p)return;if(e.target.classList.contains('like')){p.liked=!p.liked;p.likes+=p.liked?1:-1;save();renderFeed()}if(e.target.classList.contains('delete')){posts=posts.filter(x=>x.id!==p.id);save();renderFeed();render()}if(e.target.classList.contains('commentFocus'))el.querySelector('input').focus();if(e.target.classList.contains('share'))navigator.clipboard?.writeText(`${p.author} on ILU: ${p.text}`).then(()=>alert('Post copied!'))};
$('feed').onsubmit=e=>{if(!e.target.classList.contains('commentform'))return;e.preventDefault();const el=e.target.closest('.post'),p=posts.find(x=>x.id===el.dataset.id),input=e.target.querySelector('input');p.comments.push(input.value.trim());save();renderFeed()};render();
</script></body></html>
